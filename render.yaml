services:
  - type: web
    name: ketero-api
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://ketero.vercel.app
